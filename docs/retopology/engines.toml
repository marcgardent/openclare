# The remeshing engines (algorithms) that the tools run. Schema: README.md.
# Each id is a value of the engine facet of taxonomy.toml.

[[engine]]
id = "instant-meshes"
name = "Instant Meshes (Instant Field-Aligned Meshes)"
family = "field-aligned quadrangulation by local smoothing of an orientation field and a position field"
method = "One local smoothing operator optimizes first an orientation field (the directions of the edges), then a position field (where the vertices fall on a lattice aligned with it); the mesh is extracted from the position field. There is no global optimization, so it scales to very large inputs, point clouds included."
output = ["quads", "quad-dominant", "triangles"]
authors = "Wenzel Jakob, Marco Tarini, Daniele Panozzo, Olga Sorkine-Hornung"
licence = "BSD-3-Clause"
source = "https://github.com/wjakob/instant-meshes"
year = 2015
status = "stale"
last_commit = 2019-11-03
papers = [{ title = "Instant Field-Aligned Meshes", authors = "Wenzel Jakob, Marco Tarini, Daniele Panozzo, Olga Sorkine-Hornung", venue = "ACM Transactions on Graphics 34(6) (SIGGRAPH Asia 2015)", year = 2015, doi = "10.1145/2816795.2818078" }]
strengths = ["executes in less than a second on meshes with hundreds of thousands of faces", "processes meshes and point clouds of several hundred million elements", "high isotropy", "aligns and snaps edges to sharp features", "takes triangle meshes, range scans and point clouds"]
notes = "Pure quads or pure triangles by default, quad- or triangle-dominant with -D (--dominant). The licence is BSD-3-Clause with an extra clause granting the authors a licence to enhancements made public. No release on GitHub; binaries linked from the README. Since version 10.2, Modo uses the algorithm for its automatic retopology (README). The project page states no limitations."
checked = 2026-10-29
sources = [
  { url = "https://github.com/wjakob/instant-meshes", what = "README, LICENSE.txt (BSD-3-Clause plus enhancements clause), last commit 2019-11-03, command-line options in src/main.cpp (-D dominant, -c crease, -r/-p symmetry)" },
  { url = "https://igl.ethz.ch/projects/instant-meshes/", what = "abstract: isotropic triangular or quad-dominant output, sharp features, speed and scale" },
  { url = "https://doi.org/10.1145/2816795.2818078", what = "DOI, volume 34 issue 6 (Crossref record)" },
]

[[engine]]
id = "quadriflow"
name = "QuadriFlow"
family = "field-aligned quadrangulation with global singularity reduction (minimum-cost flow and SAT)"
method = "Builds on Instant Field-Aligned Meshes and adds a system of linear and quadratic constraints to its objective, enforced by a global minimum-cost network flow problem and local boolean satisfiability problems, to remove singularities. The face count grows linearly with the resolution asked for; options add sharp-edge preservation (-sharp), a min-cost-flow solver (-mcf) and SAT flip removal (-sat)."
output = ["quads"]
authors = "Jingwei Huang, Yichao Zhou, Matthias Niessner, Jonathan Shewchuk, Leonidas Guibas"
licence = "BSD-3-Clause"
source = "https://github.com/hjwdzh/QuadriFlow"
year = 2018
status = "stale"
last_commit = 2019-12-07
papers = [{ title = "QuadriFlow: A Scalable and Robust Method for Quadrangulation", authors = "Jingwei Huang, Yichao Zhou, Matthias Niessner, Jonathan Richard Shewchuk, Leonidas J. Guibas", venue = "Computer Graphics Forum 37(5) (SGP 2018, Best Paper)", year = 2018, doi = "10.1111/cgf.13498" }]
strengths = ["about four times fewer singularities than Instant Meshes", "robustness and efficiency verified on 17,791 objects in the wild", "SAT flip removal guarantees a watertight result (Unix only)"]
limits = ["needs a manifold triangle mesh", "input must be a watertight manifold, otherwise it might not work (online tool)", "sharp edges not preserved unless -sharp is given", "does not clean up intersecting geometry (Blender manual)"]
notes = "The README says \"MIT License\" but LICENSE.txt holds the BSD-3-Clause text with the same enhancements clause as Instant Meshes; the licence file is taken here. Release v1.0 (2019-08-23). Built into Blender as the Quad mode of Remesh (bpy.ops.object.quadriflow_remesh), source/blender/blenkernel/intern/mesh_remesh_voxel.cc."
checked = 2026-10-29
sources = [
  { url = "https://github.com/hjwdzh/QuadriFlow", what = "README (input, options, licence statement), LICENSE.txt, last commit 2019-12-07, release v1.0" },
  { url = "https://yichaozhou.com/publication/1805quadriflow/", what = "abstract, venue SGP 2018 Best Paper / CGF, online tool note on watertight manifold input" },
  { url = "https://doi.org/10.1111/cgf.13498", what = "DOI, volume 37 issue 5 (Crossref record)" },
  { url = "https://docs.blender.org/manual/en/latest/modeling/meshes/retopology.html", what = "Blender's Quad remesher uses Quadriflow; does not clean up intersecting geometry" },
]

[[engine]]
id = "quadwild"
name = "QuadWild (Reliable Feature-Line Driven Quad-Remeshing), with or without Bi-MDF"
family = "feature-line driven patch layout, quantization and filling of patches by patterns"
method = "Computes a cross field aligned exactly with the feature lines (sharp creases, borders) and traces a coarse layout of polygonal patches whose borders include every feature line, T-junctions allowed; the layout is constrained to admit a T-junction-free pure-quad tessellation, then each patch is filled. The Bi-MDF fork replaces the integer quadratic programs of the quantization (Gurobi) by a minimum-deviation flow in a bi-directed graph, solved approximately then exactly by graph matching."
output = ["quads"]
authors = "Nico Pietroni, Stefano Nuvoli, Thomas Alderighi, Paolo Cignoni, Marco Tarini; Bi-MDF: Martin Heistermann, Jethro Warnett, David Bommes"
licence = "GPL-3.0"
source = "https://github.com/nicopietroni/quadwild"
year = 2021
status = "stale"
last_commit = 2022-03-10
papers = [
  { title = "Reliable Feature-Line Driven Quad-Remeshing", authors = "Nico Pietroni, Stefano Nuvoli, Thomas Alderighi, Paolo Cignoni, Marco Tarini", venue = "ACM Transactions on Graphics 40(4) (SIGGRAPH 2021)", year = 2021, doi = "10.1145/3450626.3459941" },
  { title = "Min-Deviation-Flow in Bi-directed Graphs for T-Mesh Quantization", authors = "Martin Heistermann, Jethro Warnett, David Bommes", venue = "ACM Transactions on Graphics 42(4) (SIGGRAPH 2023)", year = 2023, doi = "10.1145/3592437" },
]
strengths = ["reproduces feature lines by construction", "pure-quad, conforming, isometric meshes", "ideal candidate for CAD models", "fully automatic", "less than 0.5% of Thingi10K cases fail to give a usable mesh", "Bi-MDF exact solver: 0.49% of QuadWild's runtime and 11% lower energy on its 300 dataset"]
limits = ["original build needs Boost and the Gurobi solver", "CoMISo field suggested for organic meshes", "results may differ from the paper's (code has changed)"]
notes = "Licence stated as \"GPL3\" in both READMEs, no \"or later\" clause given. The Bi-MDF fork, https://github.com/cgg-bern/quadwild-bimdf (GPL-3.0), is active: last commit 2026-08-03, pre-releases v0.0.1 and v0.0.2 (2023), CMake build without Gurobi. Status and last commit above are those of the original repository. Command line: quadwild, then field_computation, field_tracing, quad_from_patches."
checked = 2026-10-29
sources = [
  { url = "https://github.com/nicopietroni/quadwild", what = "README: abstract, build (Boost, Gurobi, CoMISo), pipeline, licence GPL3; last commit 2022-03-10" },
  { url = "https://github.com/cgg-bern/quadwild-bimdf", what = "README of the Bi-MDF fork: changes, no Gurobi needed, GPL3; last commit 2026-08-03; pre-releases" },
  { url = "https://www.algohex.eu/publications/bimdf-quantization/", what = "Bi-MDF abstract, runtime and energy against QuadWild, BibTeX with DOI" },
  { url = "https://doi.org/10.1145/3450626.3459941", what = "DOI, volume 40 issue 4 (Crossref record)" },
]

[[engine]]
id = "autoremesher"
name = "AutoRemesher"
family = "field-aligned quad-dominant remeshing: isotropic remeshing, cross field, quad-cover parameterization, extraction"
method = "Splits the input into islands, remeshes each into isotropic triangles with a target-length field that moves triangles from flat to detailed regions, computes a cross field and simplifies its singularities, solves a quad-cover parameterization, then extracts quads, smoothed and projected onto the input. Parameters: target quads, edge scaling, sharp edge angle, adaptivity, anisotropy."
output = ["quad-dominant"]
authors = "Jeremy Hu (Dust3D project)"
licence = "MIT"
source = "https://github.com/huxingyi/autoremesher"
year = 2020
status = "active"
last_commit = 2026-10-07
notes = "MIT since 1.0.0 (2026-07-06, relicensed from GPLv3 by reimplementing incompatible dependencies). Latest release 1.2.0 (2026-08-23); first release 2020-08-03. 1.1.0 replaced Geogram with a native quad parameterizer, though the README still says it is built on Geogram; beta.1 (2020) replaced MIQ with QuadCover. Quad-dominant since 1.0.0-beta.3. No paper; the README and changelog state no strengths or limits. CLI mode for headless runs."
checked = 2026-10-29
sources = [
  { url = "https://github.com/huxingyi/autoremesher", what = "README (CLI parameters, licence MIT), LICENSE, last commit 2026-10-07, releases 1.0.0 to 1.2.0" },
  { url = "https://github.com/huxingyi/autoremesher/blob/master/CHANGELOGS.md", what = "relicensing to MIT, Geogram replaced, QuadCover, quad-dominant output" },
  { url = "https://github.com/huxingyi/autoremesher/blob/master/src/AutoRemesher/autoremesher.cpp", what = "pipeline: islands, isotropic remesher with target-length field, parameterizer, quad extractor" },
  { url = "https://github.com/huxingyi/autoremesher/blob/master/src/AutoRemesher/parameterizer.cpp", what = "cross field singularity simplification and quad cover solve" },
]

[[engine]]
id = "voxel"
name = "OpenVDB level set and volume-to-mesh (Blender's Voxel remesh)"
family = "voxel isosurface: signed distance level set on a sparse grid, then polygonization"
method = "The mesh is converted into a narrow-band level set on an OpenVDB sparse grid (meshToLevelSet), and the isosurface is meshed back into quads (volumeToMesh); a non-zero adaptivity merges quads where the surface allows and adds triangles. In Blender this is the Voxel Remesh operator, the Voxel mode of the Remesh modifier and, in Geometry Nodes, Mesh to Volume then Volume to Mesh."
output = ["quads", "quad-dominant"]
authors = "Ken Museth and DreamWorks Animation (VDB); OpenVDB, Academy Software Foundation; Blender integration by Blender Authors"
licence = "Apache-2.0"
source = "https://github.com/AcademySoftwareFoundation/openvdb"
year = 2013
status = "active"
last_commit = 2026-10-29
papers = [{ title = "VDB: High-Resolution Sparse Volumes with Dynamic Topology", authors = "Ken Museth", venue = "ACM Transactions on Graphics 32(3) (SIGGRAPH 2013)", year = 2013, doi = "10.1145/2487228.2487235" }]
strengths = ["uniform topology and no inner (self-intersecting) geometry", "a new manifold mesh that tries to preserve the original volume", "cleans up meshes for sculpting, 3D printing and physics stand-ins", "triangles only where the adaptivity threshold calls for them"]
limits = ["not for topology that will be deformed", "the topology is just a simple grid", "not for the Subdivision Surface or Multiresolution modifier", "adaptivity above zero disables Fix Poles and can introduce triangulation", "the input mesh should have some thickness (Remesh modifier)"]
notes = "OpenVDB was relicensed from MPL-2.0 to Apache-2.0; latest release v13.2.0 (2026-10-27). Blender's code (source/blender/blenkernel/intern/mesh_remesh_voxel.cc) is GPL-2.0-or-later and calls openvdb::tools::meshToLevelSet and VolumeToMesh; its last commit 2026-10-20. Pure quads at adaptivity 0."
checked = 2026-10-29
