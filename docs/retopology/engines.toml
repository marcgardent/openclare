]

[[engine]]
id = "adaptropic"
name = "Adaptively Isotropic Remeshing based on Curvature Smoothed Field"
family = "adaptive isotropic triangle remeshing by edge reconnection guided by a curvature field"
method = "After a sub-remeshing that splits long edges of distorted triangles, a curvature smoothed field (CSF) is computed by smoothing the curvature of the mesh; a histogram of it sets the target edge length per vertex, and edges are reconnected by split, collapse, flip and vertex relocation, as in isotropic remeshing. Triangles come out smaller where the curvature is high."
output = ["triangles"]
authors = "Chenlei Lv, Weisi Lin, Jianmin Zheng"
licence = "Apache-2.0"
source = "https://github.com/vvvwo/Adaptively-Isotropic-Remeshing"
year = 2022
status = "stale"
last_commit = 2022-05-07
papers = [{ title = "Adaptively Isotropic Remeshing Based on Curvature Smoothed Field", authors = "Chenlei Lv, Weisi Lin, Jianmin Zheng", venue = "IEEE Transactions on Visualization and Computer Graphics 30(7)", year = 2024, doi = "10.1109/TVCG.2022.3227970" }]
strengths = ["retains curvature sensitivity, keeping more geometric features", "avoids obtuse triangles as much as possible", "better balance between feature preservation and mesh quality than peers"]
limits = ["incorrect connections can break the manifold property on some manually edited meshes", "no real-time performance"]
notes = "Published online 2022-12-09, in the July 2024 issue. The name AdapTropic is not the authors': the paper and repository say adaptively isotropic remeshing. The paper's abstract and the author's publication page link this repository. The code needs VCG, PCL 1.8+, CGAL, Eigen3 and Boost; a prebuilt exe is in the repository. Command-line choice of isotropic (1) or adaptively isotropic (2)."
checked = 2026-10-29
sources = [
