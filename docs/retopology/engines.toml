]

[[engine]]
id = "mmg"
name = "Mmg (mmgs for surfaces)"
family = "metric-based mesh adaptation of triangulations by local operators"
method = "mmgs modifies a surface triangulation by local operations (point insertion, edge swapping, vertex moving, each of which can be switched off) to control its distance to the underlying surface (Hausdorff parameter) and the sizes given by an isotropic or anisotropic metric at the nodes, with gradation control. It can also mesh the zero level set of a function given at the nodes. mmg2d and mmg3d do the same for planar and tetrahedral meshes."
output = ["triangles"]
authors = "Cécile Dobrzynski, Charles Dapogny, Pascal Frey, Algiane Froehly, Cédric Lachat, Xavier Lacoste (Bordeaux INP, Inria, Université de Bordeaux, UPMC)"
licence = "LGPL-3.0-or-later"
source = "https://github.com/MmgTools/mmg"
status = "active"
last_commit = 2026-10-21
papers = [{ title = "Three-dimensional adaptive domain remeshing, implicit domain meshing, and applications to free and moving boundary problems", authors = "Charles Dapogny, Cécile Dobrzynski, Pascal Frey", venue = "Journal of Computational Physics 262", year = 2014, doi = "10.1016/j.jcp.2014.01.005" }]
strengths = ["controls the surface approximation (Hausdorff distance)", "adapts the mesh to prescribed sizes at nodes", "anisotropic adaptation", "meshes an implicit domain from a level-set function", "detects sharp features by an angle threshold"]
notes = "Last commit 2026-10-21 on the default branch develop (master: 2026-01-20); latest release v5.8.0 (2024-10-31). Copyright Bx INP/Inria/UBordeaux/UPMC, 2004-. The paper is the one listed in the repository's References.bib; it is about mmg3d. The website mmgtools.org could not be read (its TLS certificate chain did not verify), so the facts come from the repository and its mmgs man page."
checked = 2026-10-29
sources = [
  { url = "https://github.com/MmgTools/mmg", what = "README, LICENSE (LGPL v3 or later), AUTHORS, last commit 2026-10-21 (develop), release v5.8.0" },
  { url = "https://github.com/MmgTools/mmg/blob/develop/doc/man/mmgs.1.gz", what = "mmgs man page: surface remeshing, metric, level set, -hausd, -hgrad, -A, -ar, -noinsert/-noswap/-nomove" },
