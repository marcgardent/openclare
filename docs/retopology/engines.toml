# The engines (solvers) behind the retopology tools: one [[engine]] table per value of the engine facet in taxonomy.toml that names a solver.
# The schema is in README.md; a field that no source confirms is left out, never guessed.

[[engine]]
id = "instant-meshes"
name = "Instant Meshes"
authors = "Wenzel Jakob, Marco Tarini, Daniele Panozzo, Olga Sorkine-Hornung"
kind = "paper"
method = "field-aligned remeshing: a local smoothing operator optimises an orientation field and a position field, then the mesh is extracted"
year = 2015
licence = "BSD-3-Clause"
source = "https://github.com/wjakob/instant-meshes"
origin = "instant-meshes"
notes = "The licence is BSD-3-Clause with an extra clause on enhancements given back to the authors; GitHub reads it as NOASSERTION. Output: pure quads or pure triangles, or quad- or triangle-dominant."
checked = 2026-10-29

[[engine.papers]]
title = "Instant Field-Aligned Meshes"
authors = "Wenzel Jakob, Marco Tarini, Daniele Panozzo, Olga Sorkine-Hornung"
venue = "ACM Transactions on Graphics 34(6) (SIGGRAPH Asia)"
year = 2015
doi = "10.1145/2816795.2818078"

[[engine.sources]]
url = "https://igl.ethz.ch/projects/instant-meshes/"
what = "paper, SIGGRAPH Asia 2015; a unified local smoothing operator optimises edge orientations and vertex positions; position field"

[[engine.sources]]
url = "https://github.com/wjakob/instant-meshes"
what = "reference code; LICENSE.txt, BSD-3-Clause text with the enhancements clause; repository created 2015-09-14"

[[engine]]
id = "quadriflow"
name = "QuadriFlow"
authors = "Jingwei Huang, Yichao Zhou, Matthias Niessner, Jonathan Richard Shewchuk, Leonidas J. Guibas"
kind = "paper"
method = "the Instant Meshes objective with linear and quadratic constraints, enforced by a global minimum-cost network flow, to reduce singularities"
year = 2018
licence = "BSD-3-Clause"
source = "https://github.com/hjwdzh/QuadriFlow"
notes = "The licence is BSD-3-Clause with the same extra clause on enhancements as Instant Meshes; GitHub reads it as NOASSERTION. No commit since 2019-12-07. Blender builds it in as the Quad remesher (tools/quadriflow.toml), which is Blender's tool, not the engine's own program."
checked = 2026-10-29

[[engine.papers]]
title = "QuadriFlow: A Scalable and Robust Method for Quadrangulation"
authors = "Jingwei Huang, Yichao Zhou, Matthias Niessner, Jonathan Richard Shewchuk, Leonidas J. Guibas"
venue = "Computer Graphics Forum (Symposium on Geometry Processing)"
year = 2018

[[engine.sources]]
url = "https://yichaozhou.com/publication/1805quadriflow/"
what = "abstract: based on Instant Field-Aligned Meshes, linear and quadratic constraints solved by a minimum-cost network flow, fewer singularities; SGP 2018, Computer Graphics Forum"

[[engine.sources]]
url = "https://github.com/hjwdzh/QuadriFlow"
what = "reference code; LICENSE.txt, BSD-3-Clause text with the enhancements clause; last push 2019-12-07"

[[engine.sources]]
url = "https://github.com/blender/blender/blob/main/source/blender/blenkernel/intern/mesh_remesh_voxel.cc"
what = "Blender calls the QuadriFlow library (QFLOW_quadriflow_remesh) when built WITH_QUADRIFLOW"

[[engine]]
id = "quadwild"
name = "QuadWild"
authors = "Nico Pietroni, Stefano Nuvoli, Thomas Alderighi, Paolo Cignoni, Marco Tarini"
kind = "paper"
method = "feature-line driven quadrangulation: a feature-aligned cross field, a patch layout whose boundaries hold every feature line, then a pure-quad tessellation of each patch"
year = 2021
licence = "GPL-3.0-or-later"
source = "https://github.com/nicopietroni/quadwild"
notes = "The original quantization needs the Gurobi solver. The fork cgg-bern/quadwild-bimdf (GPL-3.0) replaces it with the Bi-MDF solver, builds without Gurobi and has binaries for Linux, Windows and macOS. No commit on the original since 2022-09-09."
checked = 2026-10-29

[[engine.papers]]
title = "Reliable Feature-Line Driven Quad-Remeshing"
