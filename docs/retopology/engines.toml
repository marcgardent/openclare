[[engine]]
id = "octree"
name = "Dual Contouring (Blender's dualcon)"
authors = "Tao Ju (code); paper by Tao Ju, Frank Losasso, Scott Schaefer, Joe Warren"
kind = "paper"
method = "dual contouring on an octree: the mesh is scan-converted into a signed octree with Hermite data, then one vertex is placed inside each cell, not on its edges, and the vertices are joined into quads"
year = 2002
licence = "GPL-2.0-or-later"
source = "https://github.com/blender/blender/tree/main/intern/dualcon"
notes = "The licence is that of Blender's copy (SPDX headers); the licence of Tao Ju's original code was not found. The folder keeps the readme of PolyMender 1.6 (2006) by Tao Ju, which adds topologically manifold dual contouring. Blender's Remesh modifier (Blocks, Smooth, Sharp) wraps it since 2.62; the manual itself names only the Octree Depth, not the algorithm. The modifier is Blender's tool, not the engine's own program."
checked = 2026-10-29

[[engine.papers]]
title = "Dual Contouring of Hermite Data"
authors = "Tao Ju, Frank Losasso, Scott Schaefer, Joe Warren"
venue = "ACM Transactions on Graphics 21(3) (SIGGRAPH)"
year = 2002
doi = "10.1145/566654.566586"

[[engine.sources]]
url = "https://wiki.blender.jp/Dev:Ref/Release_Notes/2.62/Remesh_Modifier"
what = "2.62 release notes (mirror of the Blender wiki): based on the paper Dual Contouring of Hermite Data, code contributed by Dr. Tao Ju; vertices within a cubic cell, not along the cell edges"

[[engine.sources]]
url = "https://archive.blender.org/lists/bf-committers/2011-December/034744.html"
what = "Remesh modifier (dual contouring) for 2.62: the dual contouring code was contributed by Dr. Tao Ju, the modifier is a simple wrapper for it"

[[engine.sources]]
url = "https://github.com/blender/blender/tree/main/intern/dualcon"
what = "octree.h: scan-conversion, sign generation and surface reconstruction, @author Tao Ju; SPDX GPL-2.0-or-later; readme.txt of PolyMender 1.6"

[[engine.sources]]
url = "https://profiles.wustl.edu/en/publications/dual-contouring-of-hermite-data-2/"
what = "paper: authors, ACM Transactions on Graphics 21(3), 339-346, 2002, DOI"

[[engine.sources]]
url = "https://history.siggraph.org/?p=118419"
what = "paper presented at SIGGRAPH 2002, same DOI"

