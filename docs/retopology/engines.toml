[[engine]]
id = "octree"
name = "Dual contouring on a signed octree (Tao Ju's PolyMender, Blender's dualcon)"
family = "octree isosurface: scan conversion, sign generation, dual contouring"
method = "Embeds the input in a uniform grid stored as an octree and marks the grid edges that cross polygons (scan conversion); generates inside/outside signs consistent with them by patching the dual surface, which works on any bag of polygons; then contours the signed grid with one vertex per cell. Blender's Blocks, Smooth and Sharp modes place that vertex at the cell centroid, at the mass point, or by Hermite data to keep sharp edges and corners."
output = ["quads"]
authors = "Tao Ju (PolyMender); intern/dualcon in Blender by Blender Authors"
licence = "GPL-2.0-or-later"
source = "https://projects.blender.org/blender/blender/src/branch/main/intern/dualcon"
year = 2004
status = "active"
last_commit = 2026-09-30
papers = [{ title = "Robust Repair of Polygonal Models", authors = "Tao Ju", venue = "ACM Transactions on Graphics 23(3) (SIGGRAPH 2004)", year = 2004, doi = "10.1145/1015706.1015815" }]
strengths = ["produces a closed surface from any bag of polygons", "consumes a small amount of time and memory space", "reproduces sharp features (dual contouring with Hermite data)", "suitable for repairing CAD models and gigantic polygonal models", "topologically manifold dual contouring (PolyMender 1.6)", "output topology contains only quads (Blender manual)"]
limits = ["dual contouring needs more memory (PolyMender readme)", "the input mesh should have some thickness", "thin parts can become loose and leave small isolated pieces"]
notes = "Blender's copy is PolyMender 1.6 (readme.txt dated 2006-10-12, files authored by Tao Ju), now under GPL-2.0-or-later SPDX headers; its directory's last commit 2026-09-30. Ju's own page: version 1.7 (2011-05-20), C++ source available for research purposes upon request. Last commit is that of the intern/dualcon path, not of all Blender."
checked = 2026-10-29
sources = [
  { url = "https://projects.blender.org/blender/blender/src/branch/main/intern/dualcon/intern/readme.txt", what = "PolyMender readme: paper, Marching Cubes / quad / Dual Contouring variants, memory, octree depth" },
  { url = "https://projects.blender.org/blender/blender/src/branch/main/intern/dualcon/dualcon.h", what = "modes centroid (blocky), mass point (smooth), sharp features; quad output; GPL-2.0-or-later" },
  { url = "https://projects.blender.org/api/v1/repos/blender/blender/commits?path=intern/dualcon", what = "last commit of intern/dualcon, 2026-09-30" },
  { url = "https://www.cse.wustl.edu/~taoju/code/polymender.htm", what = "algorithm in three steps, strengths, version 1.7, source on request" },
