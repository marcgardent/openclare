]

[[engine]]
id = "geogram"
name = "Geogram (remesh_smooth)"
family = "centroidal Voronoi tessellation on the surface, through restricted Voronoi diagrams; isotropic or anisotropic"
method = "Places the desired number of points on the surface and moves them to minimize a centroidal Voronoi tessellation energy, a few Lloyd iterations then Newton iterations, computing the Voronoi diagram restricted to the surface; the result is its dual triangulation. For anisotropic remeshing the points live in 6D (position plus scaled normal), with the security-radius theorem avoiding a 6D Delaunay triangulation; a vertex weight steers the density, for instance from the local feature size."
output = ["triangles"]
authors = "Bruno Lévy (Inria; former ALICE project)"
licence = "BSD-3-Clause"
source = "https://github.com/BrunoLevy/geogram"
status = "active"
last_commit = 2026-10-24
papers = [
  { title = "Isotropic Remeshing with Fast and Exact Computation of Restricted Voronoi Diagram", authors = "Dong-Ming Yan, Bruno Lévy, Yang Liu, Feng Sun, Wenping Wang", venue = "Computer Graphics Forum 28(5)", year = 2009, doi = "10.1111/j.1467-8659.2009.01521.x" },
  { title = "On centroidal Voronoi tessellation - energy smoothness and fast computation", authors = "Yang Liu, Wenping Wang, Bruno Lévy, Feng Sun, Dong-Ming Yan, Lin Lu, Chenglei Yang", venue = "ACM Transactions on Graphics 28(4)", year = 2009, doi = "10.1145/1559755.1559758" },
  { title = "Anisotropic and feature sensitive triangular remeshing using normal lifting", authors = "Vincent Nivoliers, Bruno Lévy, Christophe Geuzaine", venue = "Journal of Computational and Applied Mathematics 289", year = 2015, doi = "10.1016/j.cam.2015.01.041" },
  { title = "Variational Anisotropic Surface Meshing with Voronoi Parallel Linear Enumeration", authors = "Bruno Lévy, Nicolas Bonneel", venue = "International Meshing Roundtable (IMR)", year = 2012 },
]
strengths = ["well adapted to post-process the output of reconstructions", "isotropic or curvature-adapted anisotropic triangles", "density steered by a vertex weight"]
limits = ["remesh_smooth does not manage sharp features", "may generate more points than asked to solve problematic configurations", "normal smoothing needed on very irregular meshes for anisotropic remeshing"]
notes = "Latest release v1.10.1 (2026-09-01). Symposium on Geometry Processing Software Award 2023. The command-line arguments also declare a quad-dominant meshing group and a remesh:sharp_edges option, the latter only with GEOGRAM_WITH_VORPALINE (an extension not in the public repository); whether the public library makes quad-dominant meshes was not established. Development since 2000 (README); the GitHub repository dates from 2022, so no first-release year is given."
checked = 2026-10-29
sources = [
  { url = "https://github.com/BrunoLevy/geogram", what = "README (features, history, award), LICENSE (BSD 3-Clause, Inria), last commit 2026-10-24, release v1.10.1" },
