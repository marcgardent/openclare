[[engine]]
id = "autoremesher"
name = "AutoRemesher"
authors = "Jeremy Hu (huxingyi)"
kind = "program"
method = "isotropic remeshing, a cross field (QuadCover since 1.0.0-beta.1), a quad parameterization, then quad extraction; quad-dominant output"
year = 2020
licence = "MIT"
source = "https://github.com/huxingyi/autoremesher"
origin = "autoremesher"
notes = "MIT since 1.0.0; the betas of 2020 were GPL-3.0. Version 1.1.0 replaced Geogram with its own quad parameterizer, while the README still says it is built on Geogram. 1.0.0-beta.1 added OpenVDB for uniform remeshing and dropped MIQ and libQEx."
checked = 2026-10-29

[[engine.sources]]
url = "https://github.com/huxingyi/autoremesher"
what = "README (built on Geogram, libigl, isotropicremesher), MIT LICENSE, repository created 2020-06-17"

[[engine.sources]]
url = "https://github.com/huxingyi/autoremesher/blob/master/CHANGELOGS.md"
what = "QuadCover replaces MIQ and OpenVDB added (1.0.0-beta.1), quad-dominant output (1.0.0-beta.3), relicensed from GPLv3 to MIT (1.0.0), Geogram replaced by a native quad parameterizer (1.1.0)"

[[engine.sources]]
url = "https://github.com/huxingyi/autoremesher/releases"
what = "first release, unstable, 2020-08-03"

