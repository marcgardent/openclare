[[engine]]
id = "openclare"
name = "openclare"
family = "field-aligned quadrangulation through a T-mesh quantized with closed edge loops"
method = "A cross field with its singularities simplified gives a seamless parametrization, cut into a T-mesh of rectangular patches; the patch lengths are made whole by a minimum-deviation bi-directed flow (Bi-MDF), to which constraints closing the turns of the T-mesh are added so that edge loops close into rings instead of winding as helices. Each rectangle is meshed from the quantized lengths, then the mesh is relaxed and projected onto the source. Sizing follows thickness, curvature or a painted density; hard edges are cuts of the T-mesh."
output = ["quads"]
authors = "Marc Gardent"
licence = "GPL-3.0-or-later"
source = "https://github.com/marcgardent/openclare"
year = 2026
status = "active"
last_commit = 2026-10-29
papers = [
  { title = "Closing Edge Loops at Quantization Time: Helix Constraints for T-Mesh Quantization", authors = "Marc Gardent", venue = "draft, not peer reviewed", year = 2026 },
  { title = "Turns of a T-Mesh: Obstructions to Closing Edge Loops", authors = "Marc Gardent", venue = "draft, not peer reviewed", year = 2026 },
]
strengths = ["a mesh of 100 % quads, manifold, with as few irregular vertices as possible", "4.65 % of the edges on spiral loops over twelve models near 3,000 quads (paper A)", "overall mark on the bench's organic models 82, 86 and 90 at 1,000, 3,000 and 8,000 quads, against 40 to 69 for QuadriFlow, AutoRemesher and Instant Meshes", "mark 99 on the mechanical models at 1,000 quads"]
limits = ["refuses edges of three faces or more and inconsistent orientation, with a diagnosis", "pieces that go through one another are treated shell by shell", "slower than QuadriFlow: speed marks 37 to 68 against 71 to 92 on organic models"]
notes = "Rust engine with a C interface and a Blender add-on (Community edition); the quantization uses HiGHS in a crate of its own. Latest release v0.7.0 (2026-10-28). Marks from the repository's own bench, by its own author: see bench/results/SCORES.md. Both papers are drafts under CC BY 4.0 in docs/research/."
checked = 2026-10-29
sources = [
