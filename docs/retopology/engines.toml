[[engine]]
id = "cwf"
name = "CWF (Consolidating Weak Features)"
family = "variational mesh simplification: normal anisotropy plus centroidal Voronoi tessellation energy"
method = "Optimizes a set of movable points on the surface under a smooth functional: a normal anisotropy term, in the spirit of quadric error metrics but continuous, and a centroidal Voronoi tessellation energy for an even distribution, balanced by a decaying weight. A restricted Voronoi diagram is computed at each iteration."
output = ["triangles"]
authors = "Rui Xu, Longdu Liu, Ningna Wang, Shuangmin Chen, Shiqing Xin, Xiaohu Guo, Zichun Zhong, Taku Komura, Wenping Wang, Changhe Tu"
licence = "AGPL-3.0"
source = "https://github.com/Xrvitd/CWF"
year = 2024
status = "stale"
last_commit = 2024-12-17
papers = [{ title = "CWF: Consolidating Weak Features in High-quality Mesh Simplification", authors = "Rui Xu, Longdu Liu, Ningna Wang, Shuangmin Chen, Shiqing Xin, Xiaohu Guo, Zichun Zhong, Taku Komura, Wenping Wang, Changhe Tu", venue = "ACM Transactions on Graphics 43(4) (SIGGRAPH 2024)", year = 2024, doi = "10.1145/3658159" }]
strengths = ["considers accuracy, triangle quality and feature alignment together", "even point distribution", "aligns weak features", "accuracy and manifoldness (project page)"]
limits = ["tested only on 64-bit Windows with Visual Studio 2022", "not optimized for speed", "C++14 only, not C++17 or newer", "needs CGAL, Eigen3, Boost and libigl"]
notes = "The README says AGPL-3.0 and also \"For learning purposes only and not for commercial use\", asking to be contacted for commercial use; the two statements conflict. Evaluated on 100 CAD models of the ABC dataset and 21 organic models. Neither the paper's abstract nor the project page states the output in so many words; triangles follows from a simplified mesh measured by triangle quality."
checked = 2026-10-29
sources = [
  { url = "https://github.com/Xrvitd/CWF", what = "README (venue, DOI, platform, dependencies, licence statement), LICENSE (AGPL v3), last commit 2024-12-17" },
  { url = "https://arxiv.org/abs/2404.15661", what = "abstract: functional, decaying weight, weak features, evaluation" },
