authors = "Martin Heistermann, Jethro Warnett, David Bommes"
venue = "ACM Transactions on Graphics 42(4) (SIGGRAPH)"
year = 2023
doi = "10.1145/3592437"

[[engine.sources]]
url = "https://github.com/nicopietroni/quadwild"
