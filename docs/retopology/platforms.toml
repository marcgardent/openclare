[[platform]]
id = "extensions.blender.org"
name = "Blender Extensions"
url = "https://extensions.blender.org"
operator = "Blender Foundation"
kind = "official"
paid = false
licence_rule = "Add-ons must be wholly compliant with the GNU GPL v3 or later; themes and other extensions GPL v3 compatible; bundled binaries and assets (images, fonts) CC0. Free and open source only: no functionality behind a purchase, no optional commercial extras, no ads or links to commercial versions in Blender's interface."
install = "In Blender, Preferences > Get Extensions (allow online access), search, Install; or click Get on the website and drag the button into Blender."
updates = "In Blender, not automatic: check for updates by hand (or turn on Check for Updates on Startup), then update one extension or Update All."
blender = "4.2 LTS or later"
notes = "Links to external funding platforms are allowed on a listing, not in Blender's interface. The platform was opened on 2024-05-15 and shipped with Blender 4.2 LTS (July 2024). Showing the features of a commercial version on a listing counts as an advertisement and is not allowed."

[[platform.sources]]
url = "https://extensions.blender.org/about/"
what = "free and open-source directory, only GNU GPL compliant software; install with Blender 4.2 LTS or newer through Get Extensions, or drag the Get button; updates checked by hand"

[[platform.sources]]
url = "https://extensions.blender.org/terms-of-service/"
what = "terms (last updated 2026-08-10): add-ons GPL v3 or later (1.1), assets CC0 (1.2), no paywalled functionality (3.10), no commercial extras (4.3), no ads or commercial links in the UI, funding links allowed on the listing (6.1-6.3)"

[[platform.sources]]
url = "https://docs.blender.org/manual/en/latest/editors/preferences/extensions.html"
what = "Get Extensions preferences: install from the website by drag, from Blender by name, or from disk; updates checked by hand, optional check on startup, Update All"

