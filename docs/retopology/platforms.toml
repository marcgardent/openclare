[[platform]]
id = "remote-repository"
name = "Third-party extension repository"
url = "https://docs.blender.org/manual/en/latest/advanced/extensions/creating_repository/index.html"
operator = "each publisher, in a format the Blender project defines"
kind = "vendor"
paid = true
install = "In Blender, Preferences > Get Extensions > Repositories > [+] > Add Remote Repository, paste the repository's URL (and an access token if it asks for one); then install from Get Extensions as from the official platform."
updates = "In Blender, as for extensions.blender.org: check by hand or on startup, then update one or Update All."
blender = "4.2 LTS or later"
notes = "How a publisher hosts one: static, a JSON file that `blender --command extension server-generate --repo-dir=...` builds from the ZIPs (`--html` adds a page for drag-and-drop installs), served from a web server; dynamic, a server that answers with the latest compatible versions for the blender_version and platform Blender sends; or a fork of the whole Extensions website. A repository can ask for an access token, which Blender sends as an Authorization Bearer header; the Blender developers name repositories run by developers as the way to offer commercial add-ons. The manual describes no payment step: selling through a repository means giving each buyer access, for example a token (our reading). No licence rule is stated."

[[platform.sources]]
url = "https://docs.blender.org/manual/en/latest/advanced/extensions/creating_repository/index.html"
what = "three ways to host: static JSON, dynamic, fork of the Extensions website"

[[platform.sources]]
url = "https://docs.blender.org/manual/en/latest/advanced/extensions/creating_repository/static_repository.html"
what = "server-generate builds index.json (and index.html with --html); add it with Add Remote Repository"

[[platform.sources]]
url = "https://docs.blender.org/manual/en/latest/advanced/extensions/creating_repository/dynamic_repository.html"
what = "dynamic listing by blender_version and platform; access token sent as Authorization: Bearer"

[[platform.sources]]
url = "https://docs.blender.org/manual/en/latest/editors/preferences/extensions.html"
what = "Add Remote Repository from a URL; Access Token field, required by some repositories"

[[platform.sources]]
url = "https://code.blender.org/2024/05/extensions-platform-beta-release/"
what = "developers may run their own repositories to offer commercial add-ons; a single JSON file is enough"

