name = "Voxel Remesh"
slug = "voxel-remesh"
author = "Blender Foundation"
tags = ["mode:automatic", "scope:global", "guide:parameters", "output:quads", "engine:voxel", "use:sculpt", "os:windows", "os:linux", "os:macos", "density:uniform", "density:adaptive", "edge-flow:pole-control", "extra:keeps-attributes", "licence:open-source", "source:public", "blender:5-x", "install:built-in", "price:free"]
kind = "built-in"
method = "the mesh is sampled on a 3D voxel grid (OpenVDB) and a new mesh is built on its surface, of even face size"
purpose = "even topology and resolved self-intersections, mostly while sculpting"
status = "active"
checked = 2026-10-29
notes = "Ships with Blender: release is Blender's own. Quads only with Adaptivity 0; above it, triangles appear."

