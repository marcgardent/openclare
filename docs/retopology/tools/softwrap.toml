notes = "The changelog stops at 2.1.2 (2024-01-14), but the store lists Blender 5.2 and reviews of the last months name builds for 4.5 and 5.1: status active on that evidence. The store offers no macOS; the manual says a macOS build exists, untested, and that Linux needs a system Python matching Blender's."

