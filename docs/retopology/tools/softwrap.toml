name = "SoftWrap - Dynamics for Retopology"
slug = "softwrap"
author = "Jean Machado (Jeacom)"
tags = ["mode:semi-automatic", "scope:global", "guide:template", "output:template", "engine:simulation", "use:scan", "use:sculpt", "os:windows", "os:linux", "edge-flow:symmetry", "licence:open-source", "source:with-download", "blender:5-x", "install:zip", "price:paid"]
kind = "add-on"
method = "a softbody simulation, made for retopology rather than physics, that wraps a base mesh chosen by the user onto the source"
purpose = "fitting a base mesh, and so its topology, onto a scan or a sculpt"
