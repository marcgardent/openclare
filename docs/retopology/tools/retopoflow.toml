name = "RetopoFlow 4"
slug = "retopoflow"
author = "Orange Turbine (Jon Denning, Jonathan Williamson, Jonathan Lampel, JF Matheu)"
tags = ["mode:manual", "mode:semi-manual", "scope:local", "guide:strokes", "guide:boundary", "output:quads", "os:windows", "os:linux", "os:macos", "edge-flow:symmetry", "edge-flow:loops", "licence:open-source", "source:public", "blender:5-x", "install:zip", "price:paid"]
kind = "add-on"
method = "sketch-based tools in Edit Mode whose new geometry snaps to the high-poly surface: Contours (loops around cylinders), PolyStrips, Strokes (grids of quads between strokes), PolyPen, Patches (fills a hole bounded by selected edges), Relax and Tweak brushes"
purpose = "faster retopology with even, quad-based topology"
status = "active"
checked = 2026-10-29
notes = "Version 4 (October 2025) is a rewrite inside Edit Mode. GitHub publishes the source of version 4 in branches (v4.0.0 to v4.3.0) but releases only RetopoFlow 3 (3.4.x, Blender 3.6 or later per the README). The licence file says GPL 3 or later; the blender_manifest.toml of the v4 branches says GPL-2.0-or-later. Strokes and Patches fill areas between drawn strokes or selected edges, which is close to semi-automatic; the suite is filed as manual because the user places each loop or strip. Operating systems not stated on the store; the README says every version runs on any system Blender supports."

