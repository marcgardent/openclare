notes = "Four editions whose Blender versions differ, and the stores disagree: Base 5.0+ (or 4.2 - 5.2 in its own table), Premium and Pro 4.4+, Ultra 5.0+, the main Superhive listing 3.6 - 5.0; hence no blender field. Last updates August and September 2026. The field solver of Premium and the QuadWild path of Ultra run on Windows only. Pro and Ultra have an optional mode that calls the user's own Claude or GPT API key. Superhive shows half the list prices, with no sale stated. engine:ml, density:adaptive and edge-flow:curvature come from the Ultra page."

