method = "on a separate target object over the source: Precise Draw places snapped vertices and fills single quads, Draw previews and builds a quad grid inside four guide lines, Edge Flow drags a one-quad strip along a stroke, Circle Loop wraps loops around rounded forms, and Move and Relax brushes keep vertices on the source"
