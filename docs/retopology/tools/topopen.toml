notes = "Published on Superhive about 2 months ago. The product page gives version 1.14.2 and the documentation 2.0.1; neither has a date. Tested on Blender 4.5.5, 5.0.1 and 5.2.0; the documentation lists Windows. The store names the creator TopoPen and the seller Shellblend. The product page says systems other than Windows x64 run on Blender's own Python; the documentation offers a Windows ZIP only: only Windows is tagged."

