name = "Draw Xray"
slug = "draw-xray"
author = "Bartosz Styperek (bartoszstyperek)"
tags = ["mode:manual", "mode:helper", "scope:local", "guide:strokes", "licence:not-stated", "source:closed", "blender:unstated", "install:zip", "price:freemium"]
kind = "add-on"
method = "an overlay that draws the retopology mesh over the high-poly one and shows which parts lie above or below its surface; the paid version adds a snap engine that follows the curvature (sinks into valleys, pushes out on peaks, offsets the subdivision shrink) and Quad Stroke, Strip Stroke and Wrap Limbs tools that draw quad strips"
purpose = "a clearer retopology overlay than Blender's own, with snapping and strip drawing in the paid version"
status = "stale"
checked = 2026-10-29
notes = "The store states no licence. The Studio licence is asked of companies above USD 180k income; both licences allow commercial use. The free version only draws the overlay (a helper); the paid one makes faces, hence manual. The store ships a patched F2 (F2 Xray Fix) that does not crash with Draw Xray. Last update 2025-04-15, so stale by the 12-month rule."

[distribution]
url = "https://bartoszstyperek.gumroad.com/l/draw_xray"
channel = "gumroad"
licence = "not stated"
price = "USD 0+ (overlay only, no snapping), USD 18+ (with snapping and retopo tools, Standard licence), USD 32+ (Studio licence, 2-6 seats)"

[blender]
min = "4.2"
release = "4.2.3 (2025-04-15)"

