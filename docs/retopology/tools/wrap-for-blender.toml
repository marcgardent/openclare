name = "Wrap for Blender - Automatic Retopology of Any Model"
slug = "wrap-for-blender"
author = "TECA 3D (Hui Liu)"
tags = ["mode:semi-automatic", "scope:global", "guide:points", "guide:template", "output:template", "engine:own", "os:windows", "requires:account", "edge-flow:symmetry", "input:any", "licence:open-source", "source:with-download", "blender:5-x", "install:zip", "price:paid"]
kind = "add-on"
method = "wraps a base mesh chosen by the user onto the target, guided by point pairs the user places on both; the algorithm is not described"
purpose = "fitting a base mesh, and so its topology, onto another model, as an alternative to Faceform's Wrap"
status = "active"
checked = 2026-10-29
notes = "Windows 11 only; no macOS yet. The add-on works under a user account: a shared demo account is built in, and a private one is made on request through the publisher's Discord. The wrapping algorithm and any library are not named. No other store. The store says it works with any model; the 1.1.0 notes add a warning on meshes that mix triangles and quads."

