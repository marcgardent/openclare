name = "Quadwrap - Retopology Tool"
slug = "quadwrap"
author = "AFX LAB (Alberto Gonzalez)"
tags = ["mode:semi-manual", "scope:local", "guide:strokes", "output:quads", "engine:own", "use:cylinder", "edge-flow:symmetry", "edge-flow:loops", "licence:open-source", "source:with-download", "blender:5-x", "install:zip", "price:paid"]
kind = "add-on"
method = "a click-and-drag stroke along a cylindrical part extrudes rings of quads around it, with a set vertex count per ring, ring bridging, loop relax and end-cap fill"
purpose = "retopology of arms, legs, fingers, horns and other cylindrical shapes"
status = "active"
checked = 2026-10-29
notes = "The changelogs have no dates. Version 1.4 added Blender 5.0 support (Blender 5.0 was released 2025-11-18) and 1.5 came after it, so a release falls within the last 12 months. Superhive lists only Blender 5.1; the Gumroad page calls it a Blender 5.0+ tool and still shows 1.4. Also sold on FlippedNormals (https://library.flippednormals.com/product/quad-wrap-retopology-tool-67984), named by Digital Production on 2026-02-12 at USD 19; that page did not load."

