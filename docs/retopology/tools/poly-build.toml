name = "Poly Build"
slug = "poly-build"
author = "Blender Foundation"
tags = ["mode:manual", "scope:local", "os:windows", "os:macos", "os:linux", "licence:open-source", "source:public", "blender:5-x", "install:built-in", "price:free"]
kind = "built-in"
method = "an Edit Mode tool: Ctrl-click adds a vertex and a triangle on the nearest edge (Create Quads dissolves the shared edge to leave a quad), drag moves a vertex or extrudes an edge into a quad, Shift-click deletes"
purpose = "combines several mesh editing tools into one, especially for retopology"
status = "active"
checked = 2026-10-29
notes = "The manual advises enabling Snapping and Auto Merge with it."

[distribution]
