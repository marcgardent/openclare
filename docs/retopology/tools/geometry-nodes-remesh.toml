name = "Geometry Nodes: Mesh to Volume, Volume to Mesh"
slug = "geometry-nodes-remesh"
author = "Blender Foundation"
tags = ["mode:automatic", "scope:global", "guide:parameters", "output:quads", "output:triangles", "output:n-gons", "engine:voxel", "os:windows", "os:linux", "os:macos", "density:uniform", "density:adaptive", "licence:open-source", "source:public", "blender:5-x", "install:built-in", "price:free"]
kind = "built-in"
method = "Mesh to Volume makes a density grid of the mesh, Volume to Mesh builds a surface at an iso value; Dual Mesh can follow to swap faces and vertices"
purpose = "a remesh inside a node tree, non-destructive and procedural"
status = "active"
checked = 2026-10-29
notes = "A route of nodes, not one tool. The manual does not say which faces Volume to Mesh makes; quads-or-triangles is not checked. Volume to Mesh exists since 2.93, Dual Mesh since 3.1, Mesh to Volume since 3.3. After Dual Mesh the faces have as many sides as the valence of the old vertices."

