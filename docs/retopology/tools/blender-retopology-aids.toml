name = "Blender's retopology aids: Retopology overlay, face snapping, Shrinkwrap"
slug = "blender-retopology-aids"
author = "Blender Foundation"
tags = ["mode:helper", "scope:local", "os:windows", "os:linux", "os:macos", "licence:open-source", "source:public", "blender:5-x", "install:built-in", "price:free"]
kind = "built-in"
method = "the Retopology overlay draws the edit mesh see-through and offset towards the camera; Snap Target for Individual Elements (Face Project, Face Nearest) puts each moved vertex on the surface; the Shrinkwrap modifier moves every vertex to the target surface"
purpose = "seeing and keeping a new mesh on a sculpt while placing faces by hand"
status = "active"
checked = 2026-10-29
notes = "Three features, one entry, so no single oldest version: the Retopology overlay since 3.6, Face Nearest since 3.3, the Shrinkwrap modifier at least since 2.80. Before 3.6 the nearest option was Hidden Wire, which the overlay replaced."

