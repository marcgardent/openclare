name = "MMGpy - Mesh Remeshing"
slug = "mmgpy"
author = "kmarchais"
tags = ["mode:automatic", "mode:semi-automatic", "scope:global", "guide:parameters", "guide:density", "output:triangles", "engine:mmg", "os:windows", "os:linux", "os:macos", "density:adaptive", "edge-flow:feature-lines", "licence:open-source", "source:public", "blender:unstated", "install:get-extensions", "price:free"]
kind = "add-on"
method = "surface mesh adaptation with the MMG library (MmgTools), driven by a size map or a metric, through the mmgpy Python bindings"
purpose = "remeshing with presets and local refinement zones, with no scripting"
status = "active"
checked = 2026-10-29
notes = "The extension is GPL-3.0-or-later because it bundles MMG (LGPL-3.0-or-later); the mmgpy library alone is MIT. macOS on Apple Silicon only."

[distribution]
url = "https://extensions.blender.org/add-ons/mmgpy/"
channel = "extensions.blender.org"
source = "https://github.com/kmarchais/mmgpy"
licence = "GPL-3.0-or-later"
price = "free"

[blender]
min = "4.2"
release = "0.17.1 (2026-10-08)"

