notes = "Two downloads: autoremesher_quad.zip bundles the engine (Windows x64); AutoQuadRemesher.zip downloads it once from the AutoRemesher GitHub release (Windows x64, macOS x86_64, Apple Silicon through Rosetta 2). Linux needs a user-supplied build. The store says Blender 3.3 - 5.2, the docs 4.2 or newer. UVs, materials and vertex groups are not carried over. No version number or changelog. Same seller as model-optimizer-pro, which also runs AutoRemesher. No other store."

