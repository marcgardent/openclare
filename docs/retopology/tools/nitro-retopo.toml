name = "Nitro Retopo"
slug = "nitro-retopo"
author = "Adriflex"
tags = ["mode:semi-manual", "scope:local", "guide:strokes", "guide:boundary", "output:quad-dominant", "engine:own", "use:ai-generated", "use:sculpt", "use:scan", "os:windows", "edge-flow:symmetry", "licence:open-source", "source:with-download", "blender:5-x", "install:zip", "price:paid"]
kind = "add-on"
method = "the user draws boundaries (curves, lines, freehand, ellipses, existing edges) that cut the source surface into patches, sets the corners and picks a pattern for each patch, and the tool fills them; a brush simplifies topology locally, and holes and open borders are filled or bridged"
purpose = "cleaning up and retopologizing dense meshes with fused parts: AI-generated models, sculpts, 3D scans"
status = "active"
checked = 2026-10-29
notes = "First release 1.0.0 on 2026-09-21, six releases since. The pages do not say whether patches are all quads: the 1.4.0 notes give quad connections in Bridge only when the boundary samples match, and the FAQ counts the knight result in triangles (35,000); output quad-dominant is an estimate. A Prepare Surface step makes a lighter working copy of a dense source. Releases are validated on Windows."

