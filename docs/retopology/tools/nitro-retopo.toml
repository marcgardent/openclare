name = "Nitro Retopo"
slug = "nitro-retopo"
author = "Adriflex"
tags = ["mode:semi-manual", "scope:local", "guide:strokes", "guide:boundary", "output:quad-dominant", "engine:own", "use:ai-generated", "use:sculpt", "use:scan", "os:windows", "edge-flow:symmetry", "extra:uv", "extra:repair", "licence:open-source", "source:with-download", "blender:5-x", "install:zip", "price:paid"]
kind = "add-on"
method = "the user draws boundaries (curves, lines, freehand, ellipses, existing edges) that cut the source surface into patches, sets the corners and picks a pattern for each patch, and the tool fills them; a brush simplifies topology locally, and holes and open borders are filled or bridged; Generate makes a separate retopology mesh, unwrapped, with mirror, UV seam and face set options. Since 1.7.0 the add-on has four panels (Mesh Cleanup, High Poly Tools, Prepare Surface, Nitro Retopo), and Split Cut separates parts of a high-poly mesh along drawn contours, in a separate local Blender process"
purpose = "cleaning up and retopologizing dense meshes with fused parts: AI-generated models, sculpts, 3D scans"
status = "active"
checked = 2026-11-01
notes = "First release 1.0.0 on 2026-09-21, six releases since. The pages do not say whether patches are all quads: the 1.4.0 notes give quad connections in Bridge when the boundary samples match, without saying what happens otherwise, and the FAQ counts the knight result in triangles (1.5 million in the source, a 91,000-triangle working mesh, about 35,000 in the retopology, 'results vary by model'); output quad-dominant is an estimate. A Prepare Surface step makes a lighter working copy of a dense source; Verify Mesh advises it above 20 disconnected parts or 100,000 triangles by default. Patterns are cycled and rotated per patch but not named. No engine or paper is named; the publisher writes that the add-on was developed with substantial help from AI coding tools. Releases are validated on Windows. Installed as a Blender extension (drag the receipt link, or Install from Disk)."

