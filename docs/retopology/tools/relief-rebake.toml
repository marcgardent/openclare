name = "Relief Rebake"
slug = "relief-rebake"
author = "Agregarts"
tags = ["mode:automatic", "scope:global", "guide:parameters", "output:quads", "engine:own", "use:relief", "density:uniform", "licence:open-source", "source:public", "blender:unstated", "install:get-extensions", "price:free"]
kind = "add-on"
method = "ray-casts the object from above onto a regular grid, cleans the height map, and builds a watertight quad grid with straight side walls and a flat base"
purpose = "rebuilding messy relief meshes (AI-generated, scanned or remeshed panels) as clean quad height fields"
status = "active"
checked = 2026-10-29
notes = "For reliefs only: the relief must face +Z and overhangs are lost, since a height field keeps one Z per XY. The cost grows with the square of the resolution (default 1575). Needs only numpy, shipped with Blender. One version, no commit since 2026-08-29."

