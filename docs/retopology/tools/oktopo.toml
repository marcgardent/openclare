name = "OkTopo Remesher for Blender"
slug = "oktopo"
author = "Yegor Kumachov (OkTopo)"
tags = ["mode:semi-automatic", "scope:global", "guide:points", "guide:template", "output:template", "engine:own", "use:head", "extra:uv", "os:windows", "os:macos", "os:linux", "input:manifold", "licence:open-source", "source:with-download", "blender:unstated", "install:zip", "price:paid"]
kind = "add-on"
method = "the user places face markers on a head centred at the origin; the add-on imports a prepared low-poly head preset with designed edge flow and UVs and deforms it onto the source; controllers then adjust parts of the result"
purpose = "head retopology for animation and games"
status = "active"
checked = 2026-10-29
notes = "Heads only; full body is planned. The result has the topology of the add-on's preset, not one computed from the source. Input must be single-sided, without holes or thickness. Blender versions disagree: 3.3 - 5.0 in the Superhive table, 3.6 or higher on Superhive and Gumroad requirements; hence no blender field. The documentation's date 04.01.2025 is ambiguous (day or month first). Status active on the Superhive listing of 5.0 support; no changelog found. oktoporemesher.com is a placeholder page."

