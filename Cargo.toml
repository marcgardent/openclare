[workspace]
members = [
    "crates/openclare",
    "crates/openclare-cli",
    "crates/openclare-capi",
    "crates/openclare-rerun",
    "crates/openclare-viewer",
    "crates/openclare-highs",
]
# Rerun brings a lot with it: its recorder is only built when asked for
# (`--features rerun` on the command line tool), its viewer by name
# (`-p openclare-viewer`).
default-members = ["crates/openclare", "crates/openclare-cli", "crates/openclare-capi", "crates/openclare-highs"]
resolver = "3"

[workspace.package]
version = "0.17.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[workspace.dependencies]
glam = "0.34"
# Sparse direct solvers, for the constrained least-squares systems of the
# parametrization. Pure Rust, MIT.
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
# Work spread over the cores within a piece. Pure Rust, MIT or Apache-2.0;
# faer already depends on it.
rayon = "1.12"

# One version for the recorder and for the viewer: a recording is read by the
# viewer of the version that wrote it. 0.36 is the last to build with Rust
# 1.95. MIT or Apache-2.0.
rerun = { version = "0.36", default-features = false }

[profile.release]
debug = 1

# Line numbers for our own code only: with those of the dependencies, the
# viewer of Rerun weighs a gigabyte and a half.
[profile.release.package."*"]
debug = false

# The solvers are tight numeric loops: unoptimised test runs are painfully slow.
[profile.dev]
opt-level = 2
