name: papers

# The PDFs of the two research papers, docs/research/closing-loops (A) and
# docs/research/turns-of-a-t-mesh (B), each in English and in French. They are
# not kept in the repository: this workflow builds them from the LaTeX
# sources. On a pull request that touches a paper (its Lean folder aside,
# checked by lean.yml), to show that it builds; called by pages.yml, which
# serves them on the website; and by hand from the Actions tab. Each paper
# is one artifact holding paper.pdf and paper.fr.pdf (and, for B, progress.json,
# the progress of both papers, written by evidence.py), named after its folder.
# On a pull request GitHub's `paths` filter looks at the whole diff against
# the base, so the job `changes` looks at the files of the push itself and
# skips the build when none of them is a paper.
on:
  pull_request:
    paths:
      - "docs/research/**"
      - "!docs/research/turns-of-a-t-mesh/lean/**"
      - ".github/workflows/papers.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # Whether the files pushed this time touch a paper (its Lean folder aside)
  # or this workflow. When called by pages.yml and by hand, always.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      papers: ${{ steps.diff.outputs.papers }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE: ${{ github.base_ref }}
        run: |
          concerned() {
            grep -vE '^docs/research/turns-of-a-t-mesh/lean/' | grep -qE '^(docs/research/|\.github/workflows/papers\.yml$)'
          }
          if [ "$EVENT" != "pull_request" ]; then
            echo "papers=true" >> "$GITHUB_OUTPUT"
          elif [ "$ACTION" = "synchronize" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            if git diff --name-only "$BEFORE" "$AFTER" | concerned; then
              echo "papers=true" >> "$GITHUB_OUTPUT"
            else
              echo "papers=false" >> "$GITHUB_OUTPUT"
            fi
          else
            git fetch --quiet origin "$BASE"
            if git diff --name-only "origin/$BASE...HEAD" | concerned; then
              echo "papers=true" >> "$GITHUB_OUTPUT"
            else
              echo "papers=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          cat "$GITHUB_OUTPUT"
  paper:
    needs: changes
    if: needs.changes.outputs.papers == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        note: [closing-loops, turns-of-a-t-mesh]
    steps:
      # The commit of the branch rather than the merge GitHub makes for a pull
      # request: it is the one the PDF names.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: The commit the paper describes
        run: make paper-version NOTE=${{ matrix.note }}
      # The numbers drawn on the figures of paper B, checked by walking the
      # strips of the surfaces they draw.
      - name: The figures' numbers
        if: matrix.note == 'turns-of-a-t-mesh'
        run: python3 docs/research/turns-of-a-t-mesh/figures/check.py
      # Every statement of papers A and B has a level of evidence, every Lean
      # name their tags cite is declared in B's lean folder, and each French
      # paper gives the same; their progress towards a preprint, as
      # timestamped JSON, goes into B's artifact beside its PDFs.
      - name: The levels of evidence
        if: matrix.note == 'turns-of-a-t-mesh'
        run: python3 docs/research/turns-of-a-t-mesh/evidence.py --json docs/research/turns-of-a-t-mesh/progress.json
      - uses: xu-cheng/latex-action@4.1.0
        with:
          working_directory: docs/research/${{ matrix.note }}
          root_file: |
            paper.tex
            paper.fr.tex
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.note }}
          path: |
            docs/research/${{ matrix.note }}/paper.pdf
            docs/research/${{ matrix.note }}/paper.fr.pdf
            docs/research/${{ matrix.note }}/progress.json
          if-no-files-found: error
