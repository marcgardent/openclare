name: proofs

# The research note "Closing Edge Loops at Quantization Time"
# (docs/research/closing-helices): its Lean proofs checked, and its PDF built
# and kept with the run. On every push to main and every pull request that
# touches the note, and by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "docs/research/closing-helices/**"
      - ".github/workflows/proofs.yml"
  pull_request:
    paths:
      - "docs/research/closing-helices/**"
      - ".github/workflows/proofs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs/research/closing-helices/lean
    steps:
      - uses: actions/checkout@v7
      # A proof left open, or a statement taken for granted: `sorry` and
      # `admit` close a goal without proving it, `axiom` adds a fact. The
      # proofs use none; Lean only warns about the first, so look for all
      # three in the sources before building.
      - name: No sorry, admit or axiom
        run: |
          if grep -rnwE --include='*.lean' 'sorry|admit' . || \
             grep -rnE --include='*.lean' '^[[:space:]]*((private|protected|noncomputable|unsafe)[[:space:]]+)*axiom[[:space:]]' .; then
            echo "::error::a proof is left open or an axiom is declared"
            exit 1
          fi
      # elan installs the toolchain that lean-toolchain names, on first use.
      - name: elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Mathlib compiled, at the release lakefile.toml pins, so that only the
      # note's own files are built.
      - name: Mathlib
        run: lake exe cache get
      - name: Build
        run: |
          lake build 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: No declaration uses sorry
        run: |
          if grep -n "declaration uses 'sorry'" build.log; then
            echo "::error::a declaration uses sorry"
            exit 1
          fi

  paper:
    runs-on: ubuntu-24.04
    steps:
      # The commit of the branch rather than the merge GitHub makes for a pull
      # request: it is the one the PDF names.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: The commit the note describes
        run: make paper-version NOTE=closing-helices
      - uses: xu-cheng/latex-action@4.1.0
        with:
          working_directory: docs/research/closing-helices
          root_file: paper.tex
      - uses: actions/upload-artifact@v7
        with:
          name: closing-helices-paper
          path: docs/research/closing-helices/paper.pdf
          if-no-files-found: error
