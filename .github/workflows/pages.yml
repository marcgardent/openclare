name: pages

# The website (site/): built by site/build.py, its links checked, and
# published by GitHub Pages (Settings › Pages › Source: GitHub Actions) on
# every push to main. The PDFs of the research papers, which the site serves,
# are not in the repository: papers.yml builds them from the commit pushed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the one under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  papers:
    uses: ./.github/workflows/papers.yml

  build:
    needs: papers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Each paper's PDFs back in its folder, where site/build.py looks.
      - uses: actions/download-artifact@v8
        with:
          path: docs/research
      # Plain Python, nothing installed: without Pillow the pictures are
      # copied as they are rather than made WebP, a few hundred kilobytes more.
      - name: Build
        run: python3 site/build.py
      - name: Check the links
        run: python3 site/check_links.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
