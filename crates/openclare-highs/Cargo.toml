[package]
name = "openclare-highs"
description = "Rings chosen by an exact solver (HiGHS) for openclare's slow quality mode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
openclare = { path = "../openclare" }
