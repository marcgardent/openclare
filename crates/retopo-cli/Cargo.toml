[package]
name = "retopo-cli"
description = "Command line front-end for the retopo quad remesher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "retopo"
path = "src/main.rs"
doc = false

[dependencies]
retopo = { path = "../retopo" }
# Only with the `rerun` feature: see below.
retopo-rerun = { path = "../retopo-rerun", optional = true }

[features]
# `retopo remesh --record file.rrd`: records what each stage makes, for the
# Rerun viewer. Off by default: it brings a few hundred crates with it and
# asks for Rust 1.95.
rerun = ["dep:retopo-rerun"]
