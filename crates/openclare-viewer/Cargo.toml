[package]
name = "openclare-viewer"
description = "The Rerun viewer built in, to open the recordings of the openclare chains"
version.workspace = true
edition.workspace = true
# Rerun asks for a newer compiler than the library does.
rust-version = "1.95"
license.workspace = true

[[bin]]
name = "openclare-view"
path = "src/main.rs"
doc = false

[dependencies]
# A tool for those who work on the chains: the whole viewer comes with it,
# which is long to build. Nothing else in the workspace depends on it.
rerun = { workspace = true, features = ["sdk", "rrd", "native_viewer"] }
