# The record and the launcher of openclare's computations (SPEC.md). A
# workspace of its own: the engine's builds and CI do not see it.
[workspace]

[package]
name = "openclare-lab"
description = "Records every computation of openclare and runs them from a queue"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "lab"
path = "src/main.rs"

[dependencies]
# egui 0.36, the version the engine's Rerun viewer builds with on Rust 1.95.
# MIT or Apache-2.0.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
