# ---------------------------------------------------------------- before and after

[[batch]]
name = "three-budgets"
description = "The twelve models at 2970, 3000 and 3030 quads, one job each: the remesh and its measure (measure's metrics in {out}/measure.json, the mesh beside it for the valences), at one engine thread. The references to compare are the axis ref: `lab run three-budgets --axis ref=main,<branch>`, run side by side. The prepare builds the engine and the add-on, and exports the sources from the scenes by Blender the first time in each checkout."
category = "quick-bench"
prepare = "cargo build --release && make addon && python3 -c 'import sys; sys.path.insert(0, \"bench\"); import run; [run.source_path(model) for model in sys.argv[1:]]' creature blob suzanne spot pig ogre bob jerry blub rock cage part"
command = "target/release/openclare remesh bench/out/{model}/source.obj {out}/mesh.obj --preset {preset} --quads {budget} && target/release/openclare measure bench/out/{model}/source.obj {out}/mesh.obj --target {budget} --json > {out}/measure.json"
parameters = { preset = "organic" }
environment = { HIGHS_THREADS = "1" }
threads = 1
memory_limit_gb = 32
timing_matters = false

[batch.axes]
model = ["creature", "blob", "suzanne", "spot", "pig", "ogre", "bob", "jerry", "blub", "rock",
         { value = "cage", preset = "hard-surface" }, { value = "part", preset = "hard-surface" }]
budget = [2970, 3000, 3030]
ref = ["main"]

[[job]]
name = "pole-pairs-115"
description = "Ticket #115 before and after (bench/pole_pairs.py): the T-mesh of the twelve models with and without --no-pairs at {tmesh_budgets} quads; their final meshes at {budgets} on {before} (empty: main) and on 12a6675, the head of claude/pole-pairs-115; the male body's export and conflicts.py on both when its source is there (it is not in git, so not in lab's checkouts). The sources are exported from the scenes by Blender at the first run of a checkout. One engine thread per run, {threads} runs at a time; the seconds are compared, so it waits for a calm machine."
category = "quick-bench"
command = "python3 bench/pole_pairs.py --before '{before}' --tmesh-budgets {tmesh_budgets} --budgets {budgets} --jobs {threads}"
prepare = "cargo build --release && make addon"
checkout = "12a6675"
parameters = { before = "", tmesh_budgets = "1000,3000,8000", budgets = "2970,3000,3030" }
environment = { OPENCLARE_THREADS = "1", RAYON_NUM_THREADS = "1", HIGHS_THREADS = "1" }
memory_limit_gb = 32
timing_matters = true
outputs = ["scratch/pole-pairs/*.json"]

[[batch]]
name = "pole-pairs-115-remesh"
description = "Ticket #115 before and after: the twelve models of bench/budgets.py at 2970, 3000 and 3030 quads, on main and on 12a6675 (the head of claude/pole-pairs-115), interleaved; one job is the remesh and its measure, at one engine thread. The prepare builds the engine and the add-on, and exports the sources from the scenes by Blender the first time."
category = "quick-bench"
prepare = "cargo build --release && make addon && python3 -c 'import sys; sys.path.insert(0, \"bench\"); import run; [run.source_path(model) for model in sys.argv[1:]]' creature blob suzanne spot pig ogre bob jerry blub rock cage part"
command = "target/release/openclare remesh bench/out/{model}/source.obj {out}/mesh.obj --preset {preset} --quads {budget} && target/release/openclare measure bench/out/{model}/source.obj {out}/mesh.obj --target {budget} --json > {out}/measure.json"
parameters = { preset = "organic" }
environment = { HIGHS_THREADS = "1" }
threads = 1
memory_limit_gb = 32
timeout = "30m"
timing_matters = true

[batch.axes]
model = ["creature", "blob", "suzanne", "spot", "pig", "ogre", "bob", "jerry", "blub", "rock",
         { value = "cage", preset = "hard-surface" }, { value = "part", preset = "hard-surface" }]
budget = [2970, 3000, 3030]
ref = ["main", "12a6675"]

[[batch]]
name = "pole-pairs-115-tmesh"
description = "Ticket #115, the T-mesh (bench/pole_pairs.py, part tmesh): `openclare tmesh --json` of the twelve models at 1000, 3000 and 8000 quads, the pole pairs joined and with --no-pairs (which only 12a6675, the head of claude/pole-pairs-115, has), one job each at one engine thread: patches, thin patches, short arcs, T-junctions in {out}/tmesh.json."
category = "quick-bench"
prepare = "cargo build --release && make addon && python3 -c 'import sys; sys.path.insert(0, \"bench\"); import run; [run.source_path(model) for model in sys.argv[1:]]' creature blob suzanne spot pig ogre bob jerry blub rock cage part"
command = "target/release/openclare tmesh bench/out/{model}/source.obj --quads {budget} --simplify 2 --json {crease} {pairs_flag} > {out}/tmesh.json"
checkout = "12a6675"
parameters = { crease = "", pairs_flag = "" }
environment = { HIGHS_THREADS = "1" }
threads = 1
memory_limit_gb = 32
timeout = "30m"
timing_matters = true

[batch.axes]
model = ["creature", "blob", "suzanne", "spot", "pig", "ogre", "bob", "jerry", "blub", "rock",
         { value = "cage", crease = "--crease-angle 30" }, { value = "part", crease = "--crease-angle 30" }]
budget = [1000, 3000, 8000]
pairs = [{ value = "joined", pairs_flag = "" }, { value = "no-pairs", pairs_flag = "--no-pairs" }]

