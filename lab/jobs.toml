# ---------------------------------------------------------------- dependencies

[[dependency]]
name = "engine"
description = "The engine's command line of a commit, release; shared by the commits whose engine sources are the same."
category = "build"
command = "cargo build --release -p openclare-cli && cp target/release/openclare {out}/"
key = ["crates/openclare", "crates/openclare-cli", "crates/openclare-highs", "crates/openclare-rerun", "Cargo.toml", "Cargo.lock"]
tools = ["rustc"]
provides = "openclare"

[[dependency]]
name = "source"
description = "A scene of the bench as the add-on sees it, modifiers applied, in triangles (bench/blender_run.py --no-remesh): what a result is measured against. Blender, a few seconds; the engine's library is not loaded."
category = "quick-bench"
command = "blender -b --factory-startup bench/scenes/{model}.blend --python-exit-code 1 --python bench/blender_run.py -- --out {out} --no-remesh"
key = ["bench/scenes/{model}.blend", "bench/blender_run.py", "bench/blender_engine.py", "blender/openclare"]
tools = ["blender"]
provides = "source.obj"
threads = 1
memory_limit_gb = 32
timeout = "10m"

# ---------------------------------------------------------------- before and after

[[batch]]
name = "three-budgets"
description = "The twelve models at 2970, 3000 and 3030 quads, one job each: the remesh and its measure (measure's metrics in {out}/measure.json, the mesh beside it for the valences), the engine on the thread setting. The references to compare are the axis ref: `lab run three-budgets --axis ref=main,<branch>`, run side by side. The engine of each commit and the sources are dependencies, made once and shared."
category = "quick-bench"
needs = ["engine", "source"]
command = "{engine} remesh {source} {out}/mesh.obj --preset {preset} --quads {budget} && {engine} measure {source} {out}/mesh.obj --target {budget} --json > {out}/measure.json"
report = "python3 bench/before_after.py {records} --side ref --by budget --out {out}"
parameters = { preset = "organic" }
memory_limit_gb = 32
timing_matters = false

[batch.axes]
model = ["creature", "blob", "suzanne", "spot", "pig", "ogre", "bob", "jerry", "blub", "rock",
         { value = "cage", preset = "hard-surface" }, { value = "part", preset = "hard-surface" }]
budget = [2970, 3000, 3030]
ref = ["main"]

[[batch]]
name = "pole-pairs-115-male-body"
description = "Ticket #115, the male body: the export on the engine of each side, then conflicts.py on it (one job a side: conflicts reads the export), on main and on b42bcd6 (12a6675 rebased on main, the same engine sources, with the scene, which 12a6675 has not). Its source is the dependency source of bench/scenes/human_male.blend (the file of research/NIGHT.md, MD5 f1fe33002b731d1d41846daed6c59f5e). The whole thread setting for each, one side after the other."
category = "quick-bench"
needs = ["engine", "source"]
command = "python3 docs/research/turns-of-a-t-mesh/experiments/export.py --openclare {engine} --commit {commit} --source {source} --out {out}/male-body && python3 docs/research/turns-of-a-t-mesh/experiments/conflicts.py {out}/male-body --out {out}/conflicts --summary {out}/conflicts.json"
parameters = { model = "human_male" }
memory_limit_gb = 32
timeout = "1h"
timing_matters = false
skip_done = false
axes = { ref = ["main", "b42bcd6"] }

[[batch]]
name = "pole-pairs-115-remesh"
description = "Ticket #115 before and after: the twelve models of bench/budgets.py at 2970, 3000 and 3030 quads, on main and on 12a6675 (the head of claude/pole-pairs-115), interleaved; one job is the remesh and its measure, the engine on the thread setting. The engine of each commit and the sources are dependencies, made once and shared."
category = "quick-bench"
needs = ["engine", "source"]
command = "{engine} remesh {source} {out}/mesh.obj --preset {preset} --quads {budget} && {engine} measure {source} {out}/mesh.obj --target {budget} --json > {out}/measure.json"
report = "python3 bench/before_after.py {records} --side ref --by budget --out {out}"
parameters = { preset = "organic" }
memory_limit_gb = 32
timeout = "30m"
timing_matters = true

[batch.axes]
model = ["creature", "blob", "suzanne", "spot", "pig", "ogre", "bob", "jerry", "blub", "rock",
         { value = "cage", preset = "hard-surface" }, { value = "part", preset = "hard-surface" }]
budget = [2970, 3000, 3030]
ref = ["main", "12a6675"]

[[batch]]
name = "pole-pairs-115-tmesh"
description = "Ticket #115, the T-mesh (bench/pole_pairs.py, part tmesh): `openclare tmesh --json` of the twelve models at 1000, 3000 and 8000 quads, the pole pairs joined and with --no-pairs (which only 12a6675, the head of claude/pole-pairs-115, has), one job each the engine on the thread setting: patches, thin patches, short arcs, T-junctions in {out}/tmesh.json."
category = "quick-bench"
needs = ["engine", "source"]
command = "{engine} tmesh {source} --quads {budget} --simplify 2 --json {crease} {pairs_flag} > {out}/tmesh.json"
report = "python3 bench/before_after.py {records} --side pairs --by budget --file tmesh.json --keys patches,thin_patches,short_arcs,t_junctions,arcs,pole_pairs_joined,valid --sum --out {out}"
checkout = "12a6675"
parameters = { crease = "", pairs_flag = "" }
memory_limit_gb = 32
timeout = "30m"
timing_matters = true

[batch.axes]
model = ["creature", "blob", "suzanne", "spot", "pig", "ogre", "bob", "jerry", "blub", "rock",
         { value = "cage", crease = "--crease-angle 30" }, { value = "part", crease = "--crease-angle 30" }]
budget = [1000, 3000, 8000]
pairs = [{ value = "joined", pairs_flag = "" }, { value = "no-pairs", pairs_flag = "--no-pairs" }]

# ---------------------------------------------------------------- sequences

[[sequence]]
name = "paper-B-data"
description = "docs/research/turns-of-a-t-mesh/experiments/NIGHT.md, stages 1 to 4 in order (the aside of stage 5 left out)."
jobs = ["export-male-body", "lean-check-export", "census", "lattice", "conflicts", "pairs", "combs", "fox", "forced-bounds", "forced-whole-lower", "forced-sound", "forced-valid-bounds", "forced-valid", "holonomy", "strict", "certify", "lean-check-export"]

[[sequence]]
name = "paper-A-exact"
description = "docs/research/closing-loops/experiments/exact/NIGHT.md, stages 1 to 4, after paper-B-data's export."
jobs = ["exact-relaxation", "most-closable", "rings", "local-search", "exact-remesh", "end-to-end", "end-to-end-time-5", "end-to-end-male-body", "end-to-end-time-300"]

[[sequence]]
name = "before-merge"
description = "The engine built, its tests, and a quick look at the bench."
jobs = ["build-release", "test-release", "quick-bench"]
