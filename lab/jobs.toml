# The catalogue of lab (SPEC.md, section 6): the computations of the project
# that are launched from the app. Edited here by hand or in the app.
#
# command, prepare: shell lines run by `bash -c` in the checkout, from
# `directory`. Placeholders: {threads} (the effective thread count), {repo}
# (the root of the checkout), {commit} (its short hash), {ref} (the reference
# asked for), and the job's own `parameters`, editable per queue item.
# `${...}` is left to the shell.
# threads: "setting" (the global setting, the default) or a fixed number.
# The app sets OPENCLARE_THREADS, RAYON_NUM_THREADS, RUST_TEST_THREADS and
# CARGO_BUILD_JOBS to the effective count; `environment` overrides them.
# checkout: the reference the job runs on, resolved in the mirror of the
# repository: a tag ("v0.7.0"), a branch ("main", the default), a pull request
# ("pull/301") or a hash; or "ask", Marc picking it per queue item. The
# prepare of a job runs once per checkout (SPEC.md, section 7.3).
# memory_limit_gb: the cap of `ulimit -v`, per process.
# timing_matters: the job waits for a calm machine; its time may go into a paper.
# timeout: the job is ended past it ("90s", "30m", "2h"); none for a [[job]]
# unless it sets one.
#
# [[batch]] (SPEC.md, section 6b): a grid of jobs, one computation each, timed
# and recorded by lab one by one. Every field of a [[job]], plus [batch.axes]:
# each axis a placeholder with its values, the last axis varying fastest; a
# value may be a table, { value = "cage", preset = "hard-surface" }, whose
# other keys override the batch's parameters for that cell. The axis `ref` is
# the reference each cell runs on. {out} is the job's own empty folder, every
# file in it recorded. The prepare runs once per checkout, before any job,
# with the whole thread setting. The jobs run `setting / threads` at a time;
# timeout 30 minutes when the batch sets none. Run with `lab run <batch>`.
#
# [[dependency]] (SPEC.md, section 6b, R2): a job made once per key and kept in
# <lab>/cache/<name>/<key>/, shared by every batch that `needs` it: {<name>}
# in the batch's command is the file it `provides` there. The key: its command,
# the git objects under the paths of `key` (placeholders of the cell allowed),
# the versions of its `tools`. No prepare: its command does it all.
# report (R4): the command that makes a batch's table from its records, `lab
# report <batch>`: {records} the file of each cell's last record, {out} its
# folder; it computes nothing again.
# summary: the JSON that records a run of the job in the repository (`#key` for a
# record nested in it); lab reads it at every opening (SPEC.md, section 13).
#
# The durations in the descriptions are what the documents say, not what lab
# measured.

# ---------------------------------------------------------------- builds

[[job]]
name = "build-release"
description = "The engine and its command line, release (make build)."
category = "build"
command = "cargo build --release"

[[job]]
name = "addon"
description = "The Blender add-on for this system, into dist/ (make addon)."
category = "build"
command = "make addon"
outputs = ["dist/*.zip"]

# ---------------------------------------------------------------- test suites

[[job]]
name = "test-release"
description = "The engine's test suite, release; about 15 minutes (Marc). It does not rebuild target/release/openclare."
category = "test-suite"
command = "cargo test --release"
memory_limit_gb = 40

[[job]]
name = "addon-test"
description = "The add-on in a Blender without interface, and the drawing tools' logic (make addon-test; needs blender)."
category = "test-suite"
command = "make addon-test"
memory_limit_gb = 32

# ---------------------------------------------------------------- benches

[[batch]]
name = "quick-bench"
description = "One run of the add-on per model next to what the bench stored (bench/quick.py), one job per model, the engine on the thread setting; its comparison in the job's log. The prepare builds the engine and the add-on and exports the sources."
category = "quick-bench"
prepare = "cargo build --release && make addon && python3 bench/run.py --prepare --models creature,blob,suzanne,spot"
command = "python3 bench/quick.py --models {model} --target {target} --jobs 1 --out {out}"
parameters = { target = "3000" }
memory_limit_gb = 32
axes = { model = ["creature", "blob", "suzanne", "spot"] }

[[batch]]
name = "bench"
summary = "bench/results/results.json"
description = "Every remesher on every model of the checkout at one budget (bench/run.py), one job per model and tool; the seeds and the retries of a tool stay in its job. The tools use the whole machine and their times are compared: one job at a time. The prepare builds the engine and the add-on and makes every scene and source. instant-meshes-jakob and quadwild-bimdf need their programs (OPENCLARE_INSTANT_MESHES_JAKOB, OPENCLARE_QUADWILD_BIMDF), else they say not found; handmade and the local challengers run apart. The report merges the jobs into results{-T}.json and its Markdown, in its folder: to bench/results by PR."
category = "bench"
prepare = "cargo build --release && make addon && python3 bench/run.py --prepare"
command = "python3 bench/run.py --models {model} --tools {tool} --target {target} --results {out} {options}"
report = "python3 bench/run.py --merge {records} --target {target} --results {out}"
parameters = { target = "3000", options = "" }
memory_limit_gb = 32
timeout = "1h"
timing_matters = true
paper = "A"

[batch.axes]
model = ["blob", "rock", "creature", "cage", "suzanne", "ogre", "spot", "bob", "blub", "pig", "jerry", "rose", "bridge",
         "part", "cube", "lblock", "cylinder", "venturi", "ogre_hp", "watermill", "towermill", "stonemill", "windmill", "sphere", "torus"]
tool = ["quadriflow", "autoremesher", "instant-meshes-jakob", "quadwild-bimdf", "instant-meshes", "integer-grid", "openclare-uniform", "openclare"]

[[batch]]
name = "remeasure"
description = "Measure again the meshes of the results, without remeshing, one job per budget (bench/run.py --remeasure): its results file copied into the job's folder and measured there, to bench/results by PR. It measures the meshes in bench/out of the checkout: run it where the bench ran."
category = "bench"
command = "cp bench/results/results{suffix}.json {out}/ && python3 bench/run.py --remeasure --target {target} --results {out}"
parameters = { suffix = "" }
threads = 1
skip_done = false
axes = { target = [{ value = "3000", suffix = "" }, { value = "1000", suffix = "-1000" }, { value = "8000", suffix = "-8000" }] }

[[job]]
name = "scores"
summary = "bench/results/scores.json"
description = "The comparative report, marks from 0 to 100 (make scores): seconds."
category = "bench"
command = "make scores"
threads = 1
outputs = ["bench/results/SCORES.md", "bench/results/scores.json"]

