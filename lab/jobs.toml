summary = "docs/research/closing-loops/experiments/exact/results/remesh-valid.json"
description = "After forced-valid (#211): the engine meshes the male body way by way with the whole lengths P_valid found within the cap and the window (remesh.py, variant whole); valid says whether they are a sound quad mesh, which P_valid only bounds. The whole machine, a few minutes a way. The prepare refuses a checkout whose engine is not that of {frozen}."
category = "experiment"
prepare = "git diff --quiet {frozen} HEAD -- crates Cargo.toml Cargo.lock && cargo build --release"
command = "D=scratch/data-package/turns-of-a-t-mesh; L=$D/forced-valid/lengths/$(basename $(ls -d $D/male-body/export/call-*/ | head -1)); mkdir -p $L && for f in $D/forced-valid/way-*-held-size.txt; do k=$(basename $f | cut -d- -f2); tail -n +2 $f | tr '\\n' ' ' > $L/way-$k-integer.txt; done && python3 docs/research/closing-loops/experiments/exact/remesh.py --openclare target/release/openclare --commit {frozen} --engine as-is --source scratch/torso/source.obj --variants whole --most-closable $D/forced-valid/lengths --out scratch/data-package/closing-loops/remesh-valid --summary docs/research/closing-loops/experiments/exact/results/remesh-valid.json"
checkout = "ask"
parameters = { frozen = "e13fadb" }
environment = { HIGHS_THREADS = "1" }
threads = 8
memory_limit_gb = 24
timing_matters = false
outputs = ["docs/research/closing-loops/experiments/exact/results/remesh-valid.json"]
paper = "B"
tags = ["paper-B-data", "stage-4"]

